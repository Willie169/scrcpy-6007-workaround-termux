name: Build

on:
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build scrcpy
        run: |
          ./patch.sh
          cd termux-packages
          ./scripts/run-docker.sh
          ./scripts/run-docker.sh ./build-package.sh -I scrcpy
      - uses: actions/upload-artifact@v6
        with:
          name: scrcpy
          path: termux-packages/output/scrcpy_*.deb
