name: Build

on:
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Prepare
        run: |
          ./patch.sh
          cd termux-packages
          ./scripts/run-docker.sh
      - name: Build scrcpy
        run: ./scripts/run-docker.sh ./build-package.sh -I scrcpy
